<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DINO 训练流程调用树</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh}
header{background:#16213e;padding:16px 24px;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.4em;color:#e94560;white-space:nowrap}
#search{flex:1;min-width:200px;padding:10px 16px;border:1px solid #0f3460;border-radius:8px;background:#0f3460;color:#e0e0e0;font-size:14px;outline:none;transition:.2s}
#search:focus{border-color:#e94560;box-shadow:0 0 0 2px rgba(233,69,96,.3)}
#search::placeholder{color:#888}
#control-bar{display:flex;gap:8px;flex-wrap:wrap}
#control-bar button{padding:8px 16px;border:1px solid #0f3460;border-radius:6px;background:#0f3460;color:#ccc;cursor:pointer;font-size:13px;transition:.2s;white-space:nowrap}
#control-bar button:hover{background:#1a3a6e;color:#fff}
#control-bar button.active{background:#e94560;border-color:#e94560;color:#fff}
#stats{font-size:13px;color:#888;white-space:nowrap}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
#tree-container{background:#16213e;border-radius:12px;padding:20px;overflow:auto;max-height:calc(100vh - 140px)}
.tree ul{list-style:none;padding-left:24px;position:relative}
.tree ul::before{content:'';position:absolute;top:0;bottom:0;left:8px;border-left:1px dashed #2a4a7e}
.tree li{position:relative;margin:2px 0}
.tree li::before{content:'';position:absolute;top:.85em;left:-16px;width:16px;border-top:1px dashed #2a4a7e}

/* toggle button */
.toggle-btn{position:absolute;left:-22px;top:4px;width:18px;height:18px;border-radius:50%;background:#0f3460;border:1px solid #2a4a7e;color:#aaa;cursor:pointer;font-size:12px;line-height:16px;text-align:center;z-index:5;transition:.2s;padding:0}
.toggle-btn:hover{background:#1a3a6e;color:#fff}
.toggle-btn.empty{visibility:hidden}

.node{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:.2s;font-size:13.5px;position:relative;margin:1px 0}
.node:hover{filter:brightness(1.2);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.node.highlight{outline:3px solid #e94560;outline-offset:2px;z-index:10}
.node .func-name{font-weight:600;font-family:'Cascadia Code','Fira Code','Consolas',monospace}
.node .loc{font-size:11px;opacity:.7;font-family:'Cascadia Code','Fira Code','Consolas',monospace}
.node .params{font-size:11px;opacity:.85;color:#aaa}
.node .desc{font-size:11.5px;opacity:.9}
.node .return{font-size:11px;color:#4fc3f7;font-style:italic}

/* category colors */
.cat-main{background:#1b2838;border-left:3px solid #e94560}
.cat-model{background:#1a2a1a;border-left:3px solid #4caf50}
.cat-backbone{background:#1a2a2a;border-left:3px solid #26a69a}
.cat-transformer{background:#1a1a2e;border-left:3px solid #7c4dff}
.cat-loss{background:#2a1a1a;border-left:3px solid #ff7043}
.cat-data{background:#2a2a1a;border-left:3px solid #ffc107}
.cat-eval{background:#1a1a2a;border-left:3px solid #42a5f5}
.cat-util{background:#222;border-left:3px solid #9e9e9e}
.cat-loop{background:#1b1a28;border-left:3px solid #ff6e40}

.detail-panel{position:fixed;right:20px;top:100px;width:400px;max-height:calc(100vh - 140px);overflow-y:auto;background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:20px;display:none;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.detail-panel.show{display:block}
.detail-panel h3{color:#e94560;margin-bottom:12px;font-size:1.1em}
.detail-panel .field{margin:8px 0}
.detail-panel .field-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.5px}
.detail-panel .field-value{font-size:13.5px;color:#ddd;margin-top:2px;word-break:break-all}
.detail-panel .field-value code{background:#0f3460;padding:2px 6px;border-radius:3px;font-size:12px}
.detail-panel .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:#888;font-size:20px;cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.detail-panel .close-btn:hover{background:#0f3460;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199;display:none}
.overlay.show{display:block}

.tooltip{position:fixed;pointer-events:none;background:#0f3460;color:#ddd;padding:6px 10px;border-radius:6px;font-size:12px;z-index:300;display:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}

@media(max-width:900px){
  .detail-panel{width:calc(100vw - 40px);right:20px;left:20px}
}

/* animated pulse for search matches */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.6)}50%{box-shadow:0 0 0 8px rgba(233,69,96,0)}}
.node.pulse{animation:pulse 1.5s ease-in-out}
</style>
</head>
<body>

<header>
  <h1>🦕 DINO 训练流程调用树</h1>
  <input type="text" id="search" placeholder="搜索函数名、文件名、参数..." oninput="doSearch()">
  <div id="control-bar">
    <button onclick="expandAll()" title="展开全部节点">📖 全部展开</button>
    <button onclick="collapseAll()" title="折叠全部节点">📕 全部折叠</button>
    <button onclick="expandToLevel(3)" title="展开到第3层">🔍 展开3层</button>
    <button onclick="expandToLevel(5)" title="展开到第5层">🔍 展开5层</button>
    <button onclick="clearSearch()">✕ 清除搜索</button>
  </div>
  <span id="stats"></span>
</header>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail">
  <button class="close-btn" onclick="closeDetail()">×</button>
  <h3 id="detail-title"></h3>
  <div id="detail-body"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<main>
<div id="tree-container">
<div class="tree">

<!-- Tree nodes rendered by JS -->
<ul id="root-tree"></ul>

</div>
</div>
</main>

<script>

// Tree Data Structure

// Constructor helper for nodes
function N(funcName, cat, file, line, params, desc, returns, children) {
  return {funcName, cat, file, line, params, desc, returns, children:children||[]};
}

// Categories (used in CSS): main, model, backbone, transformer, loss, data, eval, util, loop

// ============================================================
// Render tree
// ============================================================
let nodeIdCounter = 0;
let nodeMap = {}; // id -> {nodeData, liElement}

function createTreeHTML(node, depth) {
  if (!node) return '';
  const id = ++nodeIdCounter;
  const hasChildren = node.children && node.children.length > 0;
  const catClass = 'cat-' + (node.cat || 'util');

  // Build inline marker chips
  let chips = '';
  if (node.file) {
    const locStr = node.line ? `${node.file}:${node.line}` : node.file;
    chips += `<span class="loc">📍 ${locStr}</span>`;
  }
  if (node.returns) {
    chips += `<span class="return">→ ${node.returns.length > 40 ? node.returns.slice(0,40)+'...' : node.returns}</span>`;
  }
  if (node.params) {
    const shortParams = node.params.length > 60 ? node.params.slice(0,60)+'...' : node.params;
    chips += `<span class="params">⚙ ${shortParams}</span>`;
  }

  let html = `<li data-node-id="${id}">`;
  if (hasChildren) {
    html += `<button class="toggle-btn" onclick="toggleNode(this)" title="展开/折叠">▸</button>`;
  } else {
    html += `<span class="toggle-btn empty"></span>`;
  }

  html += `<div class="node ${catClass}" onclick="showDetail(${id})"
    data-func="${escapeHtml(node.funcName)}"
    data-file="${escapeHtml(node.file||'')}"
    data-line="${node.line||''}"
    data-params="${escapeHtml(node.params||'')}"
    data-desc="${escapeHtml(node.desc||'')}"
    data-return="${escapeHtml(node.returns||'')}"
  >
    <span class="func-name">${node.funcName}</span>${chips}
    ${node.desc && node.desc.length < 40 ? `<span class="desc"> — ${node.desc}</span>` : ''}
  </div>`;

  if (hasChildren) {
    html += '<ul>';
    for (const child of node.children) {
      html += createTreeHTML(child, depth + 1);
    }
    html += '</ul>';
  }

  html += '</li>';

  // Store in map
  nodeMap[id] = {nodeData: node};
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ============================================================
// Initialize
// ============================================================
document.getElementById('root-tree').innerHTML = createTreeHTML(TREE, 0);
document.getElementById('stats').textContent = `共 ${nodeIdCounter} 个节点`;

// Initially collapse deep levels
collapseAll();

function toggleNode(btn) {
  const li = btn.parentElement;
  const ul = li.querySelector(':scope > ul');
  if (!ul) return;
  const isCollapsed = ul.style.display === 'none';
  ul.style.display = isCollapsed ? '' : 'none';
  btn.textContent = isCollapsed ? '▾' : '▸';
}

function expandAll() {
  document.querySelectorAll('.tree ul').forEach(ul => ul.style.display = '');
  document.querySelectorAll('.toggle-btn:not(.empty)').forEach(btn => btn.textContent = '▾');
}

function collapseAll() {
  document.querySelectorAll('#root-tree > li > ul').forEach(ul => {
    // collapse only top-level ul and below
  });
  document.querySelectorAll('.tree ul').forEach(ul => ul.style.display = 'none');
  document.querySelectorAll('.toggle-btn:not(.empty)').forEach(btn => btn.textContent = '▸');
  // But show root
  const rootUl = document.querySelector('#root-tree > li > ul');
  if (rootUl) rootUl.style.display = '';
  document.querySelector('#root-tree > li > .toggle-btn') && (document.querySelector('#root-tree > li > .toggle-btn').textContent = '▾');
}

function expandToLevel(maxDepth) {
  // First collapse all
  document.querySelectorAll('.tree ul').forEach(ul => ul.style.display = 'none');
  document.querySelectorAll('.toggle-btn:not(.empty)').forEach(btn => btn.textContent = '▸');

  // Then expand to specified depth
  function expandDepth(li, currentDepth) {
    const ul = li.querySelector(':scope > ul');
    const btn = li.querySelector(':scope > .toggle-btn');
    if (ul && currentDepth < maxDepth) {
      ul.style.display = '';
      if (btn) btn.textContent = '▾';
      ul.querySelectorAll(':scope > li').forEach(childLi => expandDepth(childLi, currentDepth + 1));
    }
  }
  document.querySelectorAll('#root-tree > li').forEach(rootLi => expandDepth(rootLi, 0));

  // Ensure root is visible
  const rootUl = document.querySelector('#root-tree > li > ul');
  if (rootUl) {
    rootUl.style.display = '';
    const rootBtn = document.querySelector('#root-tree > li > .toggle-btn');
    if (rootBtn) rootBtn.textContent = '▾';
    rootUl.querySelectorAll(':scope > li').forEach(li => expandDepth(li, 1));
  }
}

function showDetail(id) {
  const entry = nodeMap[id];
  if (!entry) return;
  const n = entry.nodeData;

  document.getElementById('detail-title').textContent = n.funcName;
  let body = '';
  if (n.file) {
    const loc = n.line ? `${n.file}:${n.line}` : n.file;
    body += `<div class="field"><div class="field-label">📍 文件位置</div><div class="field-value"><code>${escapeHtml(loc)}</code></div></div>`;
  }
  if (n.desc) {
    body += `<div class="field"><div class="field-label">📝 功能描述</div><div class="field-value">${escapeHtml(n.desc)}</div></div>`;
  }
  if (n.params) {
    body += `<div class="field"><div class="field-label">⚙ 参数</div><div class="field-value">${escapeHtml(n.params)}</div></div>`;
  }
  if (n.returns) {
    body += `<div class="field"><div class="field-label">📤 返回值</div><div class="field-value">${escapeHtml(n.returns)}</div></div>`;
  }
  if (n.children && n.children.length > 0) {
    body += `<div class="field"><div class="field-label">🔗 子调用</div><div class="field-value">${n.children.length} 个函数</div></div>`;
  }
  body += `<div class="field"><div class="field-label">🏷 分类</div><div class="field-value">${escapeHtml(n.cat)}</div></div>`;

  document.getElementById('detail-body').innerHTML = body;
  document.getElementById('detail').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

  const query = document.getElementById('search').value.trim().toLowerCase();
  if (!query) {
    document.getElementById('stats').textContent = `共 ${nodeIdCounter} 个节点`;
    return;
  }

  // Search all nodes
  for (const [id, entry] of Object.entries(nodeMap)) {
    const n = entry.nodeData;
    const searchStr = [
      n.funcName, n.file||'', n.params||'', n.desc||'', n.returns||''
    ].join(' ').toLowerCase();

    if (searchStr.includes(query)) {
      searchResults.push(parseInt(id));
    }
  }

  document.getElementById('stats').textContent = `找到 ${searchResults.length} 个匹配节点 (共 ${nodeIdCounter} 个)`;

  if (searchResults.length > 0) {
    // Expand all ancestors of all matches
    searchResults.forEach(id => {
      const li = document.querySelector(`li[data-node-id="${id}"]`);
      if (li) {
        // Walk up and expand all parent <ul>
        let el = li.parentElement;
        while (el) {
          if (el.tagName === 'UL') {
            el.style.display = '';
            // Update toggle button
            const parentLi = el.parentElement;
            if (parentLi && parentLi.tagName === 'LI') {
              const btn = parentLi.querySelector(':scope > .toggle-btn');
              if (btn && !btn.classList.contains('empty')) btn.textContent = '▾';
            }
          }
          el = el.parentElement;
        }
        // Highlight
        const node = li.querySelector(':scope > .node');
        if (node) node.classList.add('highlight');
      }
    });

    // Scroll to first match
    const firstLi = document.querySelector(`li[data-node-id="${searchResults[0]}"]`);
    if (firstLi) {
      const node = firstLi.querySelector(':scope > .node');
      if (node) {
        node.classList.add('pulse');
        node.scrollIntoView({behavior:'smooth',block:'center'});
      }
    }
  }
}

function clearSearch() {
  document.getElementById('search').value = '';
  document.querySelectorAll('.node.highlight').forEach(n => n.classList.remove('highlight'));
  document.querySelectorAll('.node.pulse').forEach(n => n.classList.remove('pulse'));
  document.getElementById('stats').textContent = `共 ${nodeIdCounter} 个节点`;
  searchResults = [];
  currentResultIdx = -1;
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeDetail();
    clearSearch();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// Initial expand: show first 3 levels
document.addEventListener('DOMContentLoaded', function() {
  expandToLevel(3);
  document.getElementById('stats').textContent = `共 ${nodeIdCounter} 个节点 (已展开3层)`;
});
</script>

</body>
</html>
